name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix admin

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint, tests, and builds
        run: npm run check
        env:
          PAYSTACK_E2E_SECRET_KEY: ${{ secrets.PAYSTACK_E2E_SECRET_KEY }}
